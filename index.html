<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Lista de Pendientes</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="contenedor">

        <div class="seccion-superior">
            <div class="to-do">
                <h1>To - Do</h1>
            </div>

            <form id="formulario" class="buscador">
                <input type="text" id="descripcion" placeholder="En que estas pensando..." required>
                <button type="submit" class="boton-agregar">
                    Agregar Nuevo
                </button>
            </form>
        </div>

        <div class="fila encabezado-lista">
            <div class="columna"><b>Descripcion</b></div>
            <div class="columna"><b>Estado</b></div>
            <div class="columna"><b>Operacion</b></div>
        </div>

        <div id="tabla"></div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/obtenerPendientes.js"></script>
    <script src="js/crearPendientes.js"></script>
    <script src="js/actualizarPendientes.js"></script>
    <script src="js/eliminarPendientes.js"></script>

</body>

</html>
