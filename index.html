<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Requerimientos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Roboto:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
        }

        .navbar {
            background-color: #007bff;
        }

        .btn-primary {
            background-color: #dc3545;
            border: none;
        }

        .btn-primary:hover {
            background-color: #a71d2a;
        }

        .accent-yellow {
            border-top: 5px solid #ffc107;
        }

        .badge-cart {
            background-color: #ffc107;
            color: black;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark navbar-expand-lg shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="bi bi-shop"></i> Tienda Virtual</a>
            <div class="d-flex align-items-center text-white">
                <span class="me-3" id="session-text">Invitado</span>
                <button class="btn btn-light position-relative btn-sm me-2" data-bs-toggle="modal"
                    data-bs-target="#cartModal">
                    <i class="bi bi-cart3"></i> Carrito
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill badge-cart"
                        id="cart-count">0</span>
                </button>
                <button class="btn btn-warning btn-sm d-none" id="btn-tarjetas-modal" data-bs-toggle="modal"
                    data-bs-target="#cardsModal"><i class="bi bi-credit-card"></i> Mis Tarjetas</button>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card p-4 shadow-sm accent-yellow">
                    <h4 class="fw-bold mb-3"><i class="bi bi-person-lock"></i> Acceso / Registro</h4>
                    <form id="login-form">
                        <div class="mb-3">
                            <label class="form-label">Usuario</label>
                            <input type="text" id="u-name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <input type="password" id="u-pass" class="form-control"
                                pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[\W_]).{6,}"
                                title="Debe incluir mayúscula, minúscula, número y un símbolo." required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Elegir Rol</label>
                            <select id="u-role" class="form-select">
                                <option value="1">Cliente</option>
                                <option value="2">Administrador</option>
                            </select>
                        </div>
                        <button type="button" class="btn btn-success w-100 mb-2"
                            onclick="authAction('register')">Registrarse</button>
                        <button type="button" class="btn btn-outline-primary w-100"
                            onclick="authAction('login')">Iniciar Sesión</button>
                    </form>
                </div>

                <div class="card p-4 shadow-sm mt-4 d-none" id="admin-panel">
                    <h5 class="fw-bold text-danger"><i class="bi bi-gear"></i> Gestión (Admin)</h5>
                    <button class="btn btn-outline-secondary w-100 mb-2 btn-sm" data-bs-toggle="modal"
                        data-bs-target="#productModal">Agregar Producto</button>
                </div>
            </div>

            <div class="col-md-8">
                <h2 class="fw-bold mb-4"><i class="bi bi-grid-3x3-gap"></i> Productos Disponibles</h2>
                <div class="row" id="catalog-container"></div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="cartModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Tu Carrito de Compras</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <ul class="list-group mb-3" id="cart-list"></ul>
                    <div class="mb-3">
                        <label class="form-label">Seleccionar Tarjeta para Pago</label>
                        <select id="cart-card-select" class="form-select">
                            <option value="">Ninguna / Efectivo</option>
                        </select>
                    </div>
                    <button class="btn btn-primary w-100" onclick="checkout()">Confirmar Compra</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="cardsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Gestionar mis Tarjetas</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="card-form" class="mb-4">
                        <input type="text" id="card-num" class="form-control mb-2" placeholder="No. Tarjeta" required>
                        <input type="text" id="card-prop" class="form-control mb-2" placeholder="Propietario" required>
                        <button type="button" class="btn btn-success btn-sm w-100" onclick="guardarTarjeta()">Vincular
                            Tarjeta</button>
                    </form>
                    <ul class="list-group" id="user-cards-list"></ul>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Nuevo Producto</h5><button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="product-form">
                        <input type="text" id="p-name" class="form-control mb-2" placeholder="Nombre" required>
                        <input type="number" step="0.01" id="p-price" class="form-control mb-2" placeholder="Precio ($)"
                            required>
                        <input type="number" id="p-stock" class="form-control mb-2" placeholder="Stock" required>
                        <input type="number" id="p-cat" class="form-control mb-2" placeholder="ID Categoría (Ej: 1)"
                            required>
                        <input type="text" id="p-desc" class="form-control mb-2" placeholder="Descripción">
                        <button type="button" class="btn btn-primary w-100" onclick="guardarProducto()">Guardar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let user = null;
        let cart = [];
        let productsData = [];

        document.addEventListener("DOMContentLoaded", renderProducts);

        async function authAction(action) {
            const nombre = document.getElementById('u-name').value;
            const password = document.getElementById('u-pass').value;
            const idRol = parseInt(document.getElementById('u-role').value);

            const res = await fetch(`/api/auth/${action}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre, password, idRol })
            });
            const data = await res.json();

            if (res.ok) {
                if (action === 'login') {
                    user = data.usuario;
                    document.getElementById('session-text').innerText = `Hola, ${user.nombre}`;
                    document.getElementById('btn-tarjetas-modal').classList.remove('d-none');
                    if (user.idRol === 2 || user.idrol === 2) document.getElementById('admin-panel').classList.remove('d-none');
                    loadUserCards();
                    alert("¡Bienvenido!");
                } else alert("Registrado. Ya puedes iniciar sesión.");
            } else alert("Error: " + data.error);
        }

        async function renderProducts() {
            const res = await fetch('/api/productos');
            productsData = await res.json();
            const container = document.getElementById('catalog-container');
            container.innerHTML = '';

            productsData.forEach(p => {
                container.innerHTML += `
                    <div class="col-md-6 mb-3">
                        <div class="card h-100 shadow-sm">
                            <div class="card-body d-flex flex-column justify-content-between">
                                <div>
                                    <h5 class="fw-bold">${p.Nombre || p.nombre}</h5>
                                    <p class="text-muted small">${p.descripcion || 'Sin descripción'}</p>
                                </div>
                                <div>
                                    <p class="fw-bold text-danger fs-5 mb-1">$${p.Precio || p.precio}</p>
                                    <small class="d-block mb-3 text-secondary">Disponibles: ${p.Stock || p.stock}</small>
                                    <button class="btn btn-primary btn-sm w-100" onclick="addToCart(${p.idProductos || p.idproductos})"><i class="bi bi-cart-plus"></i> Elegir producto</button>
                                </div>
                            </div>
                        </div>
                    </div>`;
            });
        }

        function addToCart(id) {
            const prod = productsData.find(p => (p.idProductos || p.idproductos) === id);
            cart.push(prod);
            document.getElementById('cart-count').innerText = cart.length;
            updateCartModal();
        }

        function updateCartModal() {
            const list = document.getElementById('cart-list');
            list.innerHTML = '';
            cart.forEach((item, index) => {
                list.innerHTML += `<li class="list-group-item d-flex justify-content-between align-items-center">
                    ${item.Nombre || item.nombre} - $${item.Precio || item.precio}
                    <button class="btn btn-danger btn-sm" onclick="removeFromCart(${index})"><i class="bi bi-trash"></i></button>
                </li>`;
            });
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            document.getElementById('cart-count').innerText = cart.length;
            updateCartModal();
        }

        async function loadUserCards() {
            if (!user) return;
            const res = await fetch(`/api/tarjetas/${user.idUsuario || user.idusuario}`);
            const cards = await res.json();

            const select = document.getElementById('cart-card-select');
            const list = document.getElementById('user-cards-list');
            select.innerHTML = '<option value="">Ninguna / Efectivo</option>';
            list.innerHTML = '';

            cards.forEach(c => {
                select.innerHTML += `<option value="${c.idTarjeta}">${c.NoTarjeta}</option>`;
                list.innerHTML += `<li class="list-group-item d-flex justify-content-between">${c.NoTarjeta} <button class="btn btn-sm btn-danger" onclick="deleteCard(${c.idTarjeta})">X</button></li>`;
            });
        }

        async function guardarTarjeta() {
            const noTarjeta = document.getElementById('card-num').value;
            const propietario = document.getElementById('card-prop').value;
            await fetch('/api/tarjetas', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ noTarjeta, propietario, idUsuario: user.idUsuario || user.idusuario })
            });
            document.getElementById('card-form').reset();
            loadUserCards();
        }

        async function deleteCard(idTarjeta) {
            await fetch(`/api/tarjetas/${idTarjeta}`, { method: 'DELETE' });
            loadUserCards();
        }

        async function checkout() {
            if (!user) return alert("Inicia sesión primero");
            if (cart.length === 0) return alert("Carrito vacío");

            const cardId = document.getElementById('cart-card-select').value;
            const items = cart.map(i => ({ idProducto: i.idProductos || i.idproductos, cantidad: 1 }));

            const res = await fetch('/api/comprar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    idUsuario: user.idUsuario || user.idusuario,
                    idTarjeta: cardId ? parseInt(cardId) : null,
                    items
                })
            });

            if (res.ok) {
                const d = await res.json();
                alert(`¡Compra Exitosa!\nTotal pagado: $${d.total}`);
                cart = [];
                document.getElementById('cart-count').innerText = 0;
                updateCartModal();
                bootstrap.Modal.getInstance(document.getElementById('cartModal')).hide();
                renderProducts();
            } else {
                const err = await res.json();
                alert("Error en la compra: " + err.error);
            }
        }

        async function guardarProducto() {
            const nombre = document.getElementById('p-name').value;
            const precio = parseFloat(document.getElementById('p-price').value);
            const stock = parseInt(document.getElementById('p-stock').value);
            const idCategoria = parseInt(document.getElementById('p-cat').value);
            const descripcion = document.getElementById('p-desc').value;

            const res = await fetch('/api/productos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre, precio, stock, idCategoria, descripcion })
            });

            if (res.ok) {
                document.getElementById('product-form').reset();
                renderProducts();
                bootstrap.Modal.getInstance(document.getElementById('productModal')).hide();
            } else {
                const err = await res.json();
                alert("Error: " + err.error);
            }
        }
    </script>
</body>

</html>
